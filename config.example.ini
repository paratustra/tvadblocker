[obs]
# OBS Studio WebSocket v5 (Tools -> WebSocket Server Settings). OBS 28+.
host = localhost
port = 4455
password =
# Scene shown while the channel logo is present (normal programming).
tv_scene = tv
# Scene shown while the logo is absent (ad break).
ad_scene = adbreak

[ndi]
# Case-insensitive substring to pick a source; empty = first one found.
source_name =

[detection]
logo_path = logo.png
# TM_CCORR_NORMED score (0..1). Logo counts as present at/above present_threshold,
# absent at/below absent_threshold; the gap in between is a hysteresis dead-zone.
present_threshold = 0.90
absent_threshold = 0.85
# Consecutive agreeing frames required before a scene switch.
debounce_frames = 3
# Seconds between samples.
interval_seconds = 1.0
# Size of the top-right region searched, as a fraction of the frame.
roi_width_ratio = 0.25
roi_height_ratio = 0.25
# Width (px) of the source the logo was captured from; 0 disables rescaling.
logo_capture_width = 0
